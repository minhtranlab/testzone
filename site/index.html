<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Zone</title>
<meta name="description" content="Test Zone: SAT and AP practice tests.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Test Zone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!--
  Test Zone — nice link (ticket #25). This page only shows the Apps Script web app full screen.
  The app, its data and every rule stay on the Apps Script side; the old script.google.com link keeps working.
  Source: site/index.html on main; published to the gh-pages branch by tools/publish_site.sh.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f1f1f; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #wait p { margin: 0 0 8px; }
  #wait a { color: #324dc7; }
  #wait .muted { color: #6b6b6b; font-size: 14px; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: #ffffff; }
  #app.on { visibility: visible; }
</style>
</head>
<body>
<div id="wait">
  <div>
    <p><b>Test Zone</b> is loading…</p>
    <p class="muted" id="slow" hidden>Taking long? <a id="direct" href="#" rel="noopener">Open Test Zone directly</a></p>
  </div>
</div>
<iframe id="app" title="Test Zone" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  (function () {
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxCLbgQdFZ0ykhVx5q0vw5dpTtwi4zSUnaWUrc59-7wQIhmyXIi3EWfQ19WOD84cm1D/exec';
    var f = document.getElementById('app');
    document.getElementById('direct').href = APP_URL;
    f.addEventListener('load', function () { f.className = 'on'; try { f.focus(); } catch (e) {} });
    setTimeout(function () { document.getElementById('slow').hidden = false; }, 12000);
    f.src = APP_URL;
  })();
</script>
<noscript><p style="padding:16px">Test Zone needs JavaScript. <a href="https://script.google.com/macros/s/AKfycbxCLbgQdFZ0ykhVx5q0vw5dpTtwi4zSUnaWUrc59-7wQIhmyXIi3EWfQ19WOD84cm1D/exec">Open Test Zone</a></p></noscript>
</body>
</html>
