<script>
/* ======================= Test Zone — client engine =======================
 * All interaction is local. Server calls: login, listForms, getTest, autosave, submit, getResult.
 * State is saved to localStorage on every change and to the server every autosave_sec.
 * The server-side clock decides remaining time: remaining = limit − (serverNow − part_start).
 */
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); });
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var LS = {
    get: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /** google.script.run as a promise */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  /** Text for the student: only the app's own English messages ("LOGIN: …", "SESSION: …", "FORM: …"). Anything else
   *  (network / library / browser text, often in the browser's language) → one plain English line (#16 m3). */
  var NET_MSG = 'Could not reach the server. Check your internet connection and try again.';
  function errMsg(e) {
    var m = String((e && e.message) || e || '').replace(/^(Error|Exception):\s*/, '');
    try { console.warn('server call failed: ' + m); } catch (x) {}
    var k = /^(LOGIN|SESSION|FORM):\s*/.exec(m);
    return k ? m.slice(k[0].length) : NET_MSG;
  }
  /** A random id for this browser (login lock-out counts wrong codes per device; #16 m8). */
  function deviceId() {
    var d = LS.get('tz_dev');
    if (!d) { d = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); LS.set('tz_dev', d); }
    return d;
  }

  /* ---------------- app state ---------------- */
  var A = {
    student: null, code: '', test: null, profile: null, parts: {}, qs: {}, st: null,
    events: [], evBase: 0, acked: 0, offset: 0, tick: null, saveIv: null, saving: false, ending: false,
    calc: null, calcSci: null, desmosLoading: null, annotMode: false, lastSel: null, hlActive: null
  };
  window.TZ = A; // for the test harness / debugging

  function serverNow() { return Date.now() + A.offset; }
  function lsKey() { return 'tz_s_' + A.test.session.session_id; }
  function curPart() { return A.st ? A.st.current_part : null; }
  function pdef(p) { return A.parts[p || curPart()]; }
  function pst(p) { return A.st.parts[p || curPart()]; }
  function qlist(p) { return A.qs[p || curPart()] || []; }
  function word() { return (A.profile && A.profile.part_word) || 'part'; } // "part" (AP) / "module" (SAT)

  /* ---------------- screens ---------------- */
  function show(id) { $$('.screen').forEach(function (s) { s.classList.toggle('on', s.id === id); }); }
  function view(id) {
    $$('#tmain .view').forEach(function (v) { v.classList.toggle('on', v.id === id); });
    var inQ = id === 'v-question', inR = id === 'v-review', inTest = inQ || inR;
    $('#btn-nav').parentNode.style.visibility = inQ ? 'visible' : 'hidden';
    $('#btn-back').classList.toggle('hidden', !inTest);
    $('#btn-next').classList.toggle('hidden', !inTest);
    var d = pdef();
    $('#tool-annot').classList.toggle('hidden', !(inQ && d && d.annotate !== false));
    $('#tool-more').classList.toggle('hidden', !inTest);
    $('#practice-banner').classList.toggle('on', !!(inTest && A.profile && A.profile.practice_banner));
    $('#tool-calc').classList.toggle('hidden', !(inTest && d && d.calculator));
    $('#tool-ref').classList.toggle('hidden', !(inTest && d && d.reference));
    $('#btn-dir').classList.toggle('hidden', !inTest);
    $('#timer').style.visibility = id === 'v-break' ? 'hidden' : ''; // no test clock on the break screen
    if (!inTest) { closePops(); hideCalc(true); $('#ref-panel').classList.remove('on'); }
    if (!inQ) hideHlToolbar();
  }
  function toast(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, ms || 2600);
  }
  function modal(title, bodyHtml, buttons) {
    return new Promise(function (resolve) {
      var root = $('#modal-root');
      root.innerHTML = '';
      var m = el('div', { class: 'modal', role: 'dialog' }, '<h3>' + esc(title) + '</h3><div class="body">' + bodyHtml + '</div>');
      var b = el('div', { class: 'btns' });
      buttons.forEach(function (bt) {
        var x = el('button', { class: bt.cls || 'btn-blue', type: 'button' }, esc(bt.label));
        x.onclick = function () { root.classList.remove('on'); root.innerHTML = ''; resolve(bt.value); };
        b.appendChild(x);
      });
      m.appendChild(b); root.appendChild(m); root.classList.add('on');
    });
  }
  function setSaveDot(t) { $('#save-dot').textContent = t || ''; }

  /* ---------------- device ---------------- */
  function deviceStr() {
    var ua = navigator.userAgent || '';
    var os = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' :
             /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux' : 'Other';
    var br = /Edg\//.test(ua) ? 'Edge' : /(Chrome|CriOS)\//.test(ua) ? 'Chrome' : /(Firefox|FxiOS)\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
    return os + ' ' + br + ' ' + window.innerWidth + 'x' + window.innerHeight;
  }

  /* ================= login / home ================= */
  function initLogin() {
    $('#login-form').addEventListener('submit', function (e) { e.preventDefault(); doLogin($('#login-code').value, false); });
    var out = function () { LS.del('tz_code'); LS.del('tz_active'); A.student = null; A.teacher = false; A.code = null; $('#login-code').value = ''; $('#login-err').textContent = ''; show('scr-login'); };
    $('#btn-logout').onclick = out; $('#t-logout').onclick = out;
    var saved = LS.get('tz_code');
    if (saved) doLogin(saved, true);
  }
  function doLogin(code, auto) {
    code = String(code || '').trim().toUpperCase();
    if (!code) { $('#login-err').textContent = 'Enter your code.'; return; }
    $('#login-btn').disabled = true; $('#login-err').textContent = auto ? 'Signing in…' : '';
    call('login', code, deviceId()).then(function (r) {
      $('#login-btn').disabled = false;
      if (!r.ok) { $('#login-err').textContent = r.msg; LS.del('tz_code'); return; }
      if (r.teacher) { // teacher mode: the code is never stored on the device
        LS.del('tz_code'); LS.del('tz_active'); A.teacher = true; A.code = code; A.student = { name: 'Teacher', code: code };
        $$('.app-name').forEach(function (x) { x.textContent = r.app_name || 'Test Zone'; });
        showTeacher(); return;
      }
      A.teacher = false;
      A.student = r.student; A.code = r.student.code;
      LS.set('tz_code', A.code);
      $$('.app-name').forEach(function (x) { x.textContent = r.app_name || 'Test Zone'; });
      document.title = r.app_name || 'Test Zone';
      var act = LS.get('tz_active');
      if (act && act.code === A.code && act.session_id) { openTest(act.form_id, { resume: act.session_id }); return; }
      showHome();
    }).catch(function (e) {
      $('#login-btn').disabled = false;
      $('#login-code').value = code;
      $('#login-err').textContent = 'No connection. Signing in again automatically when the internet is back…';
      clearTimeout(A.reloginT);
      var retry = function () { if (!A.student) doLogin(code, true); };
      A.reloginT = setTimeout(retry, 10000);
      window.addEventListener('online', retry, { once: true });
    });
  }
  function showHome() {
    A.profile = null; stopLoops(); clearTimeout(A.subT); // nothing of a test runs behind My Tests
    show('scr-home');
    $('#home-name').textContent = A.student.name;
    $('#home-hello').textContent = '';
    $('#home-list').innerHTML = '<div class="spinner"></div>';
    call('listForms', A.code).then(function (r) {
      var box = $('#home-list'); box.innerHTML = '';
      var fn = r.first_name || A.student.name || '';
      $('#home-hello').textContent = 'Hi ' + fn + '. ' + (r.welcome ? 'Welcome to Test Zone.' : r.hero ? 'Here is your next test.' : 'Here are your tests.');
      if (!r.forms.length && !(r.past || []).length) { box.innerHTML = '<div class="empty">No tests for your program yet. Ask your teacher.</div>'; return; }
      // #35 hero ("Assigned by your teacher" / "Next test") + "Pick up where you stopped"
      var pick = r.pickup || [];
      if (r.hero || pick.length) {
        var sec = el('section', { class: 'hz-next' + (pick.length && r.hero ? '' : ' solo') });
        if (r.hero) sec.appendChild(heroBlock(r.hero, r.forms));
        if (pick.length) sec.appendChild(pickupBlock(pick));
        box.appendChild(sec);
      }
      box.appendChild(el('h2', { class: 'hz-h2' }, 'All tests'));
      var tiles = el('div', { class: 'hz-tiles' });
      r.forms.forEach(function (f) {
        var isHero = r.hero && f.form_id === r.hero.form_id && (f.scope || 'full') === r.hero.scope && !!f.assigned === (r.hero.kind === 'assignment');
        if (f.assigned && isHero) { formInfo(f); return; } // the assignment is the big block above
        tiles.appendChild(formCard(f));
      });
      box.appendChild(tiles);
      if (r.past && r.past.length) { box.appendChild(el('h2', { class: 'hz-h2' }, 'Past assignments')); box.appendChild(pastList(r.past)); }
    }).catch(function (e) { $('#home-list').innerHTML = '<div class="empty">Could not load your tests: ' + esc(errMsg(e)) + ' <br><br><button class="btn-outline" onclick="location.reload()">Reload</button></div>'; });
  }
  /** start options of a card (an assignment starts with its parts) */
  function scopeOpts(scope, o) { o = o || {}; if (scope && scope !== 'full') o.scope = scope; return o; }
  function heroBlock(h, forms) {
    var f = forms.filter(function (x) { return x.form_id === h.form_id && (x.scope || 'full') === h.scope; })[0];
    if (f) formInfo(f);
    var a = el('article', { class: 'hz-focus', id: 'hero' });
    a.innerHTML = '<div><p class="hz-eyebrow' + (h.kind === 'assignment' ? '' : ' nx') + '">' + (h.kind === 'assignment' ? 'Assigned by your teacher' : 'Next test') + '</p>' +
      '<h1>' + esc(h.title) + '</h1><p class="hz-of">' + esc(h.of) + '</p><ul class="hz-facts">' +
      h.facts.map(function (x) { return '<li>' + (x.b ? '<b>' + esc(x.b) + '</b> ' : '') + esc(x.t) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="hz-clock"><div>' + esc(h.clock) + '<small>' + esc(h.clock_unit) + '</small></div></div>';
    var b = el('button', { class: 'hz-btn big', type: 'button', id: 'hero-start' }, esc(h.start));
    b.onclick = function () { openTest(h.form_id, scopeOpts(h.scope, {})); };
    a.appendChild(b);
    return a;
  }
  function pickupBlock(list) {
    var d = el('div', { class: 'hz-side', id: 'pickup' });
    d.innerHTML = '<p class="hz-label">Pick up where you stopped</p>';
    list.forEach(function (p) {
      var row = el('div', { class: 'hz-resume' });
      row.innerHTML = '<div><b>' + esc(cardTitle(p.exam, p.title)) + '</b><span>' + esc(p.sub || '') + '</span></div>';
      var b = el('button', { class: 'hz-btn ghost', type: 'button' }, esc(p.button || 'Continue'));
      b.onclick = function () { openTest(p.form_id, { resume: p.session_id }); };
      row.appendChild(b);
      row.appendChild(el('div', { class: 'hz-prog' }, '<i style="width:' + Math.max(0, Math.min(100, p.pct || 0)) + '%"></i>'));
      row.appendChild(el('span', { class: 'w' }, esc(p.line || '')));
      d.appendChild(row);
    });
    return d;
  }
  /** #32 n1 + #35: attempts of assignments that are no longer active — View result only. */
  function pastList(items) {
    var d = el('div', { class: 'hz-past past-asg' });
    items.forEach(function (f) {
      f.attempts.slice().reverse().forEach(function (a) {
        var row = el('div', { class: 'hz-prow past-row' }), finished = a.status === 'completed' || a.status === 'timeout';
        row.innerHTML = '<span class="nm">' + esc(cardTitle(f.exam, f.title)) + (f.attempts.length > 1 ? ' · #' + a.attempt_no : '') + '</span><span class="dt">' + esc(a.submitted_at || a.started_at) + '</span>' +
          '<span class="ps">' + (finished && a.total_correct !== null ? a.total_correct + '/' + a.total_questions : 'Not finished') + '</span>';
        if (finished) { var b = el('button', { class: 'hz-link', type: 'button' }, 'View result'); b.onclick = function () { openResult(a.session_id); }; row.appendChild(b); }
        else row.appendChild(el('span'));
        d.appendChild(row);
      });
    });
    return d;
  }
  /** "SAT · August 2026" stays as it is; "Practice Exam 2012" → "AP Calculus AB — Practice Exam 2012". */
  function cardTitle(exam, title) { exam = exam || ''; title = title || ''; return !title ? exam : (title.indexOf(exam) === 0 ? title : exam + ' — ' + title); }
  /** 134 → "2 h 14 min", 105 → "1 h 45 min", 45 → "45 min" */
  function hmin(m) { m = Math.round(m); var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h' + (r ? ' ' + r + ' min' : '') : r + ' min'; }
  /** Lines "Section 1, Module 1: …: 27 questions · 32 min · no calculator" (+ break) — shown on the start screen only (#24 A). */
  function partLines(parts, breakMin) {
    var l = parts.map(function (p) { return esc(p.title || ('Part ' + p.part)) + ': ' + p.n + (p.n === 1 ? ' question · ' : ' questions · ') + p.minutes + ' min · ' + (p.calculator ? 'calculator' : 'no calculator'); });
    if (breakMin) l.push(breakMin + '-minute break between sections');
    return l.join('<br>');
  }
  /** card data for the start screen (lines per part, total time) — also for a card shown as the big block */
  function formInfo(f) {
    var total = f.parts.reduce(function (a, p) { return a + (Number(p.minutes) || 0); }, 0);
    A.cardInfo = A.cardInfo || {}; A.cardInfo[f.form_id + '|' + (f.scope || 'full')] = { title: cardTitle(f.exam, f.title), lines: partLines(f.parts, f.break_min), total: hmin(total) };
    return total;
  }
  /** #35 tile in "All tests": title + grey time, "x done · last a/b" (no estimate), buttons; all attempts folded below. */
  function formCard(f) {
    var c = el('div', { class: 'form-card' });
    var total = formInfo(f), scope = f.scope || 'full';
    c.innerHTML = '<div class="fc-head"><h2>' + esc(cardTitle(f.exam, f.title)) + '</h2><span class="fc-time">' + hmin(total) + '</span></div>' +
      (f.assigned ? '<div class="fc-assigned">Assigned by your teacher</div>' : '');
    if (f.assigned) { c.classList.add('assigned'); c.dataset.scope = scope; }
    var open = f.attempts.filter(function (a) { return a.status === 'in_progress' || a.status === 'paused'; }).pop();
    var done = f.attempts.filter(function (a) { return a.status === 'completed' || a.status === 'timeout'; });
    var last = done[done.length - 1], pz = open && open.paused;
    var status = !f.available ? 'Coming soon' : open ? (pz ? (f.break_min && pz.done && pz.next ? 'Paused at the break' : 'Paused · ' + pz.next + ' next') : 'In progress')
      : done.length ? done.length + ' done · last ' + (last.total_correct !== null ? last.total_correct + '/' + last.total_questions : '—') : 'Not started';
    c.appendChild(el('span', { class: 'fc-s' }, esc(status)));
    var actions = el('div', { class: 'actions' });
    if (f.available && open) {
      var b1 = el('button', { class: 'btn-blue', type: 'button' }, pz ? 'Continue ' + esc(pz.next) : 'Continue');
      b1.onclick = function () { openTest(f.form_id, { resume: open.session_id }); };
      var b2 = el('button', { class: 'btn-outline', type: 'button' }, 'Start over');
      b2.onclick = function () {
        modal('Start a new attempt?', 'Your unfinished attempt ' + open.attempt_no + ' will be closed and will not be scored.', [
          { label: 'Cancel', value: false, cls: 'btn-outline' }, { label: 'Start new attempt', value: true }]).then(function (ok) { if (ok) openTest(f.form_id, scopeOpts(scope, { fresh: true })); });
      };
      actions.appendChild(b1); actions.appendChild(b2);
    } else if (f.available) {
      var b = el('button', { class: 'btn-blue', type: 'button' }, done.length ? 'Take again' : 'Start');
      b.onclick = function () { openTest(f.form_id, scopeOpts(scope, {})); };
      actions.appendChild(b);
      if (last) { var v = el('button', { class: 'btn-plain fc-view', type: 'button' }, 'View result'); v.onclick = function () { openResult(last.session_id); }; actions.appendChild(v); }
    }
    c.appendChild(actions);
    var past = f.attempts.filter(function (a) { return a.status !== 'in_progress' && a.status !== 'paused'; });
    if (past.length > 1) {
      var det = el('details', { class: 'fc-more' });
      det.innerHTML = '<summary>All attempts (' + past.length + ')</summary>';
      var t = el('table', { class: 'attempts' });
      t.innerHTML = '<tr><th>Attempt</th><th>Date</th><th>Score</th><th></th></tr>';
      past.slice().reverse().forEach(function (a) {
        var tr = el('tr'), finished = a.status === 'completed' || a.status === 'timeout';
        tr.innerHTML = '<td>#' + a.attempt_no + '</td><td>' + esc(a.submitted_at || a.started_at) + '</td><td>' +
          (finished && a.total_correct !== null ? a.total_correct + '/' + a.total_questions : esc(a.status === 'abandoned' ? 'not finished' : a.status)) + '</td><td></td>';
        if (finished) { var vb = el('button', { class: 'btn-plain', type: 'button' }, 'View result'); vb.onclick = function () { openResult(a.session_id); }; tr.lastChild.appendChild(vb); }
        t.appendChild(tr);
      });
      det.appendChild(t); c.appendChild(det);
    }
    return c;
  }

  /* ================= load / resume a test ================= */
  function openTest(formId, opts) {
    // #32 t2: no old header / timer / "Saved …" while the test loads
    var scr = $('#scr-test'); scr.classList.remove('viewing', 'ro');
    $('#tb-title').textContent = ''; var vb = $('#view-bar'); if (vb) vb.innerHTML = ''; setSaveDot('');
    show('scr-test'); view('v-wait');
    $('#timer').style.visibility = 'hidden';
    $('#v-wait').innerHTML = '<div class="page"><div class="spinner"></div><p class="lead">Loading your test…</p></div>';
    $('#fb-name').textContent = A.student.name;
    opts = opts || {}; opts.device = deviceStr();
    var t0 = Date.now();
    call('getTest', A.code, formId, opts).then(function (res) {
      var rtt = Date.now() - t0;
      A.offset = res.server_now + rtt / 2 - Date.now();
      setupTest(res);
    }).catch(function (e) {
      var m = (e && e.message) || String(e);
      if (/(SESSION|FORM|LOGIN):/.test(m)) { // the server said no: forget it
        LS.del('tz_active');
        modal('Could not open the test', esc(errMsg(e)), [{ label: 'OK', value: 1 }]).then(showHome);
      } else loadTrouble(e); // network / server hiccup: keep tz_active so a retry resumes
    });
  }

  function newState(res) {
    var prof = res.profile, targets = {};
    (prof.routing || []).forEach(function (r) { targets[r.hard] = 1; targets[r.easy] = 1; });
    var seq = prof.parts.map(function (p) { return p.part; }).filter(function (p) { return !targets[p]; });
    var parts = {};
    prof.parts.forEach(function (p) { parts[p.part] = { cur: 0, ans: {}, elim: {}, mark: {}, hl: {}, elimMode: false }; });
    return { v: 1, session_id: res.session.session_id, form_id: res.session.form_id, seq: 0, seq_parts: seq, part_idx: 0,
             current_part: seq[0], phase: 'directions', part_starts: {}, ended: {}, route: {}, warned: {}, parts: parts,
             timer_hidden: false, zoom: 1 };
  }

  /** Something failed while (re)building the test page: keep everything, offer a retry. */
  function loadTrouble(e) {
    console.error(e);
    built = null;
    show('scr-test'); view('v-wait');
    $('#v-wait').innerHTML = '<div class="page center"><h1 style="font-size:24px">Still loading…</h1><p class="lead">Your answers and time are saved. ' +
      'Check the internet connection, then tap <b>Try again</b>.</p><button class="btn-blue" id="btn-retry" type="button">Try again</button></div>';
    $('#btn-retry').onclick = function () { location.reload(); };
  }
  function setupTest(res) {
    try { setupTest0(res); } catch (e) { loadTrouble(e); }
  }
  function setupTest0(res) {
    A.test = res; A.profile = res.profile; A.parts = {}; A.qs = {}; A.ending = false;
    A.copy = res.copy || ''; A.dead = false; // N1: this window's copy token (the server keeps only the newest)
    setSaveDot('');                          // N3: no "Saved hh:mm" left over from another attempt
    $('#tool-annot span').textContent = res.profile.annotate_label || 'Annotate';
    $('#scr-test').classList.toggle('serif', res.profile.question_font === 'serif'); // SAT: question text + choices in a serif face (Bluebook look)
    res.profile.parts.forEach(function (p) { A.parts[p.part] = p; A.qs[p.part] = []; });
    res.questions.forEach(function (q) { (A.qs[q.part] = A.qs[q.part] || []).push(q); });
    Object.keys(A.qs).forEach(function (p) { A.qs[p].sort(function (a, b) { return a.display_no - b.display_no; }); });
    var sid = res.session.session_id, saved = Number(res.session.events_saved) || 0;
    var local = LS.get('tz_s_' + sid);
    var server = res.state;
    if (local && local.state && (!server || (local.state.seq || 0) >= (server.seq || 0)) && local.evBase + local.events.length >= saved) {
      A.st = local.state; A.events = local.events || []; A.evBase = local.evBase || 0; A.acked = Math.max(local.acked || 0, saved);
      if (server) { // server clock + locks win
        Object.keys(server.part_starts || {}).forEach(function (p) { A.st.part_starts[p] = server.part_starts[p]; });
        Object.keys(server.ended || {}).forEach(function (p) { if (server.ended[p]) A.st.ended[p] = server.ended[p]; });
      }
    } else if (server) {
      A.st = server; A.events = []; A.evBase = saved; A.acked = saved;
      if (local && local.state && local.state.part_starts) Object.keys(local.state.part_starts).forEach(function (p) { if (!A.st.part_starts[p]) A.st.part_starts[p] = local.state.part_starts[p]; });
    } else {

  /** Show whatever the state says we are on. */

  /* ================= ending parts + submit ================= */
  function endPart(reason) {
    if (A.ending) return;
    var p = curPart();

    A.ending = true;
    if (A.st.phase === 'test') { var q = curQ(); if (q) log('q_leave', q.qid, null); }
    log('part_end', null, reason);
    A.st.ended[p] = reason;
    $('#warn-banner').classList.remove('on');

    advanceAfter(p);

  function advanceAfter(p) {
    var rule = (A.profile.routing || []).filter(function (r) { return r.from === p; })[0];
    var go = function () {
      A.ending = false;

      A.st.part_idx++;

      var d = A.parts[p] || {}, nd = A.parts[next] || {};

        if (!A.st.part_starts[next]) A.st.part_starts[next] = serverNow();
        A.st.phase = 'test';
        log('part_start', null, next);
        persist(); autosave();
        toast((nd.title || next) + ' has started.', 3500);
        route();
        return;
      }
      A.st.phase = d.break_after_sec ? 'break' : 'transition';
      persist(); autosave();
      route();

      var tryRoute = function () {

  /* ---------- floating panels (drag + resize, mouse + touch) ---------- */
  function makeFloating(panel, head, handle, onResize) {
    head.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      e.preventDefault(); head.setPointerCapture(e.pointerId);
      var r = panel.getBoundingClientRect(), host = panel.offsetParent.getBoundingClientRect();
      var ox = e.clientX - r.left, oy = e.clientY - r.top;
      var mv = function (ev) {
        var x = Math.max(0, Math.min(host.width - 80, ev.clientX - host.left - ox));
        var y = Math.max(0, Math.min(host.height - 40, ev.clientY - host.top - oy));
        panel.style.left = x + 'px'; panel.style.top = y + 'px'; panel.style.right = 'auto';
      };
      var up = function () { head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); dockUpdate(); };
      head.addEventListener('pointermove', mv); head.addEventListener('pointerup', up);
    });
    handle.addEventListener('pointerdown', function (e) {
      e.preventDefault(); handle.setPointerCapture(e.pointerId);
      var r = panel.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      var mv = function (ev) {
        panel.style.width = Math.max(300, r.width + ev.clientX - sx) + 'px';
        panel.style.height = Math.max(260, r.height + ev.clientY - sy) + 'px';
        if (onResize) onResize();
      };
      var up = function () { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); if (onResize) onResize(); };
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up);
    });
  }

      var s = document.createElement('script');

      s.async = true;
      s.onload = function () { window.Desmos ? resolve(window.Desmos) : reject(new Error('Desmos missing')); };
      s.onerror = function () { A.desmosLoading = null; reject(new Error('Desmos failed to load')); };
      document.head.appendChild(s);

    return A.desmosLoading;
  }

    refCell('<ellipse cx="60" cy="20" rx="32" ry="9" ' + RS + '/><path d="M28 20 L28 72 M92 20 L92 72" ' + RS + '/><path d="M28 72 A32 9 0 0 0 92 72" ' + RS + '/><path d="M28 72 A32 9 0 0 1 92 72" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 3"/><line x1="60" y1="20" x2="92" y2="20" stroke="#111" stroke-width="1.2"/><text x="73" y="8" ' + RT + '>r</text><text x="98" y="50" ' + RT + '>h</text>',

  /* ---------- reference sheet (SAT-ready) ---------- */
  function initRef() {
    var panel = $('#ref-panel');
    makeFloating(panel, $('#ref-head'), $('#ref-rs'));
    $('#tool-ref').onclick = function () {
      var on = panel.classList.toggle('on'); $('#tool-ref').classList.toggle('active', on);
      if (on && !panel._sized) { panel._sized = 1; panel.style.height = Math.max(320, Math.min(680, $('#tmain').clientHeight - 16)) + 'px'; }
      if (on) { $('#ref-body').innerHTML = A.profile.reference_sheet === 'sat' ? SAT_REF_HTML : (A.profile.reference_html || '<p>No reference sheet for this test.</p>'); typeset($('#ref-body')); }
    };
    $('#ref-x').onclick = function () { panel.classList.remove('on'); $('#tool-ref').classList.remove('active'); };
  }

  /* ---------- annotate (highlights + notes, stored as text offsets) ---------- */
  /** Highlightable text of a question: 's' = question text (stem + figures), 'p' = passage pane (SAT Reading and Writing). */
  function textRoot(qid, r) { var b = qBox(qid); return b ? (r === 'p' ? $('.q-text-pass', b) : $('.q-text', b)) : null; }
  function textNodes(root) {
    var out = [];
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        var p = n.parentNode;
        while (p && p !== root) { if (p.nodeName === 'MJX-CONTAINER' || p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE') return NodeFilter.FILTER_REJECT; p = p.parentNode; }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    while (w.nextNode()) out.push(w.currentNode);
    return out;
  }
  /** Character offset of a DOM boundary point within the highlightable text of root (math is skipped → snaps). */
  function offsetOf(root, node, off) {
    var nodes = textNodes(root), acc = 0;
    var r = document.createRange(); r.setStart(node, off); r.collapse(true);
    for (var j = 0; j < nodes.length; j++) {
      var n = nodes[j];
      if (n === node) return acc + off;
      if (r.comparePoint(n, n.data.length) <= 0) acc += n.data.length; else return acc;
    }
    return acc;
  }
  function selectionOffsets() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var q = curQ(); if (!q) return null;
    var r = sel.getRangeAt(0), which = null, root = null;
    ['s', 'p'].forEach(function (k) { var x = textRoot(q.qid, k); if (!which && x && x.contains(r.commonAncestorContainer)) { which = k; root = x; } });
    if (!root) return null;
    var s = offsetOf(root, r.startContainer, r.startOffset), e = offsetOf(root, r.endContainer, r.endOffset);
    if (e - s < 1) return null;
    return { qid: q.qid, s: s, e: e, r: which };
  }
  function unwrapHighlights(root) {
    $$('span.hl', root).forEach(function (sp) { var p = sp.parentNode; while (sp.firstChild) p.insertBefore(sp.firstChild, sp); p.removeChild(sp); });
    root.normalize();
  }
  function applyHighlights(qid) { ['s', 'p'].forEach(function (k) { applyHighlightsIn(qid, k); }); }
  function applyHighlightsIn(qid, which) {
    var root = textRoot(qid, which); if (!root) return;
    unwrapHighlights(root);
    var list = (pst().hl[qid] || []).filter(function (h) { return (h.r || 's') === which; }).sort(function (a, b) { return a.s - b.s; });
    list.forEach(function (h) {
      var nodes = textNodes(root), acc = 0, segs = [];
      nodes.forEach(function (n) {
        var a = acc, b = acc + n.data.length; acc = b;
        var s = Math.max(h.s, a), e = Math.min(h.e, b);
        if (e > s) segs.push({ n: n, s: s - a, e: e - a });
      });
      segs.forEach(function (sg) {
        if (!sg.n.data.slice(sg.s, sg.e).trim()) return;
        var mid = sg.n.splitText(sg.s); mid.splitText(sg.e - sg.s);
        var sp = document.createElement('span');
        sp.className = 'hl ' + (h.c === 'u' ? 'hl-u' : 'hl-' + h.c) + (h.note ? ' hl-note' : '');
        sp.setAttribute('data-hid', h.id);
        mid.parentNode.insertBefore(sp, mid); sp.appendChild(mid);
        sp.onclick = function (ev) { ev.stopPropagation(); openHlToolbar(qid, h.id, sp); };
      });
    });
  }
  function addHighlight(o) {
    var ps = pst(), list = ps.hl[o.qid] || [];
    var h = { id: 'h' + Date.now().toString(36), s: o.s, e: o.e, c: 'y', note: '' };
    if (o.r === 'p') h.r = 'p';
    ps.hl[o.qid] = list.concat([h]);
    log('annotate', o.qid, 'add:' + (o.r === 'p' ? 'p' : '') + o.s + '-' + o.e);
    persist();
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    applyHighlights(o.qid);
    var sp = $('span.hl[data-hid="' + h.id + '"]', qBox(o.qid));
    if (sp) openHlToolbar(o.qid, h.id, sp);
  }
  function initAnnotate() {
    document.addEventListener('selectionchange', function () {
      if (!A.st || A.st.phase !== 'test') return;
      var o = selectionOffsets(); if (o) A.lastSel = { o: o, t: Date.now() };
    });
    var maybeAuto = function () { if (!A.annotMode) return; setTimeout(function () { var o = selectionOffsets(); if (o) addHighlight(o); }, 30); };
    document.addEventListener('mouseup', maybeAuto);
    document.addEventListener('touchend', maybeAuto);
    $('#tool-annot').onclick = function () {
      var o = selectionOffsets() || (A.lastSel && Date.now() - A.lastSel.t < 8000 && curQ() && A.lastSel.o.qid === curQ().qid ? A.lastSel.o : null);
      A.lastSel = null;
      if (o) { addHighlight(o); return; }
      A.annotMode = !A.annotMode;
      $('#tool-annot').classList.toggle('active', A.annotMode);
      var nm = (A.profile && A.profile.annotate_label) || 'Annotate';
      toast(A.annotMode ? nm + ' is on: select words in the text or question to highlight them.' : nm + ' is off.');
    };
    var tb = $('#hl-toolbar');
    $$('[data-c]', tb).forEach(function (b) { b.onclick = function () { updateHl({ c: b.getAttribute('data-c') }); }; });
    $('#hl-del').onclick = function () {
      var a = A.hlActive; if (!a) return;
      pst().hl[a.qid] = (pst().hl[a.qid] || []).filter(function (h) { return h.id !== a.id; });
      log('annotate', a.qid, 'delete'); persist(); applyHighlights(a.qid); hideHlToolbar();
    };
    $('#hl-close').onclick = hideHlToolbar;
    $('#hl-note-btn').onclick = function () { var n = $('#hl-note'); n.classList.toggle('hidden'); if (!n.classList.contains('hidden')) n.focus(); };
    $('#hl-note').addEventListener('input', function () { updateHl({ note: $('#hl-note').value }, true); });
  }
  function findHl(qid, id) { return (pst().hl[qid] || []).filter(function (h) { return h.id === id; })[0]; }
  function updateHl(ch, quiet) {
    var a = A.hlActive; if (!a) return;
    var h = findHl(a.qid, a.id); if (!h) return;
    Object.keys(ch).forEach(function (k) { h[k] = ch[k]; });
    if (!quiet) log('annotate', a.qid, ch.c ? 'color:' + ch.c : 'note');
    persist();
    if (!quiet || ch.note !== undefined) {
      applyHighlights(a.qid);
      var sp = $('span.hl[data-hid="' + a.id + '"]', qBox(a.qid));
      markToolbar(h);
      if (sp && !quiet) placeToolbar(sp);
    }
  }
  function markToolbar(h) { $$('#hl-toolbar [data-c]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-c') === h.c); }); }
  function placeToolbar(sp) {
    var tb = $('#hl-toolbar'), host = $('#scr-test').getBoundingClientRect(), r = sp.getBoundingClientRect();
    tb.classList.add('on');
    var left = Math.max(8, Math.min(host.width - tb.offsetWidth - 8, r.left - host.left));
    var top = r.bottom - host.top + 8;
    if (top + tb.offsetHeight > host.height - 70) top = r.top - host.top - tb.offsetHeight - 8;
    tb.style.left = left + 'px'; tb.style.top = top + 'px';
  }
  function openHlToolbar(qid, id, sp) {
    var h = findHl(qid, id); if (!h) return;
    A.hlActive = { qid: qid, id: id };
    markToolbar(h);
    var n = $('#hl-note'); n.value = h.note || ''; n.classList.toggle('hidden', !h.note);
    placeToolbar(sp);
  }
  function hideHlToolbar() { $('#hl-toolbar').classList.remove('on'); A.hlActive = null; }

  /* ================= boot ================= */
  function boot() {
    if (typeof google === 'undefined' || !google.script) { $('#login-err').textContent = 'Open this app from its web-app link.'; return; }
    A.api = { autosave: autosave, persist: persist }; // used by the local test harness only
    initTools(); initReview(); initTeacher(); initLogin();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
